services:
  # Desarrollo con recarga en caliente: http://localhost:5173
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # necesario para detectar cambios en Windows
      # Con el perfil "db", la API del contenedor habla con la base local por la red de Docker.
      - SUPABASE_URL=${DOCKER_SUPABASE_URL:-http://gateway}
    env_file:
      - path: .env
        required: false

  # Versión de producción (como se vería desplegada): http://localhost:8080
  # Arranca con: docker compose --profile prod up --build prod
  prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"

  # Base de datos LOCAL (sin cuenta de Supabase), misma API REST (PostgREST) que usa Supabase.
  # Arranca con: docker compose --profile db up -d postgres postgrest gateway
  # Los datos quedan en el volumen "pgdata". Para empezar de cero: docker compose --profile db down -v
  postgres:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/local-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  postgrest:
    profiles: ["db"]
    image: postgrest/postgrest:v12.2.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator-dev-pw@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      # Solo para desarrollo local. NUNCA uses este secreto en producción.
      PGRST_JWT_SECRET: local-dev-jwt-secret-not-for-production-0123456789

  # Imita la puerta de entrada de Supabase: http://localhost:54321/rest/v1/...
  gateway:
    profiles: ["db"]
    image: nginx:1.27-alpine
    depends_on:
      - postgrest
    volumes:
      - ./supabase/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "54321:80"

volumes:
  pgdata:
